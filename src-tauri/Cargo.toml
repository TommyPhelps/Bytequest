[package]
name = "bytequest"
version = "0.1.0"
description = "BYTEQUEST.EXE - hands-on computing lab"
authors = ["Tommy"]
edition = "2021"
rust-version = "1.77.2"

[lib]
# The _lib suffix avoids a name clash with the binary on Windows (cargo issue #8519).
name = "bytequest_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# "bundled" compiles SQLite into the app, so nothing extra has to be installed on Windows.
rusqlite = { version = "0.37", features = ["bundled"] }
# HTTPS for the catalog link checker (rustls: no OpenSSL to install).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "charset"] }
# Path-safety rules for the project lab (dependency-free, unit-tested separately).
labfs = { path = "labfs" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
